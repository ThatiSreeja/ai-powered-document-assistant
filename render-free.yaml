# Free demo. Local data is reset when Render stops or replaces the instance.
services:
  - type: web
    name: paperwise-demo
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/paperwise/paperwise.db
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_FOLDER
        value: /tmp/paperwise/uploads
      - key: CHROMA_PATH
        value: /tmp/paperwise/chroma
      - key: EMBEDDING_CACHE_PATH
        value: /tmp/paperwise/models
