services:
  - type: web
    name: paperwise
    runtime: docker
    region: oregon
    plan: 1c-2g
    healthCheckPath: /api/health
    disk:
      name: paperwise-files
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paperwise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: CHROMA_PATH
        value: /var/data/chroma
      - key: EMBEDDING_CACHE_PATH
        value: /var/data/models

databases:
  - name: paperwise-db
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []
